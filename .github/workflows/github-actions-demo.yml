name: share data between jobs
on: push
jobs:
  job_1:
    name: saving
    runs-on: ubuntu-latest
    steps:
      - name: doing some jujutsu
        run: echo "hello world" > "file.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: file
          path: file.txt
  job_2:
    name: reading
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: file
      - run: cat file.txt
        
        
